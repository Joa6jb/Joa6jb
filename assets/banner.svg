      <stop offset="0" stop-color="#0f2219"/>
      <stop offset="1" stop-color="#1a3628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eee4cf" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1120" cy="60" r="220" fill="#3f6b52" fill-opacity=".18"/>
  <circle cx="1180" cy="300" r="140" fill="#3f6b52" fill-opacity=".12"/>

  <!-- monograma -->
  <g transform="translate(96 96)">
    <rect width="128" height="128" rx="24" fill="none" stroke="#eee4cf" stroke-opacity=".35" stroke-width="1.5"/>
    <text x="64" y="86" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-style="italic" fill="#eee4cf">JF</text>
